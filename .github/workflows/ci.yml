name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo check --manifest-path src-tauri/Cargo.toml

      - run: cargo test --manifest-path src-tauri/Cargo.toml
